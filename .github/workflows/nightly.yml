name: Input Overlay Studio CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      windows-artifact-name: studio-windows-capture
      linux-artifact-name: studio-linux-capture
      retention-days: 60
