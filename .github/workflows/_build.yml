name: Build and test Input Overlay Studio

on:
  workflow_call:
    inputs:
      windows-artifact-name:
        type: string
        default: windows-zip
      linux-artifact-name:
        type: string
        default: linux-zip
      retention-days:
        type: number
        default: 0

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build Studio
        working-directory: studio
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Browser and editor regressions
        working-directory: studio
        run: |
          pnpm exec playwright install chromium
          pnpm test:browser
          pnpm test:visual
          pnpm test:sync
          pnpm test:editor
          pnpm test:customization
          pnpm test:visual-features

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws-server/src-tauri

      - name: Rust tests
        working-directory: ws-server/src-tauri
        run: cargo test --lib

      - name: build ws-server exe
        working-directory: ws-server/src-tauri
        run: cargo build --release

      - name: upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.windows-artifact-name }}
          path: ws-server/src-tauri/target/release/input-overlay-ws.exe
          retention-days: ${{ inputs.retention-days }}

      - name: attest windows build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ws-server/src-tauri/target/release/input-overlay-ws.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build Studio
        working-directory: studio
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws-server/src-tauri

      - name: build ws-server binary
        working-directory: ws-server/src-tauri
        run: cargo build --release

      - name: upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.linux-artifact-name }}
          path: ws-server/src-tauri/target/release/input-overlay-ws
          retention-days: ${{ inputs.retention-days }}

      - name: attest linux build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ws-server/src-tauri/target/release/input-overlay-ws
